<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSC Flash Arbitrage Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1e1e1e; border: 1px solid #333; color: #fff; }
        .log-box { background-color: #0a0a0a; border: 1px solid #222; height: 250px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; }
        .status-badge { font-size: 1rem; padding: 0.5em 1em; }
    </style>
</head>
<body class="p-4">
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>⚡ BSC Flash Arbitrage Bot</h2>
            <div>
                <span id="statusBadge" class="badge bg-danger status-badge">ZATRZYMANY</span>
                <span class="ms-3 h4">Zysk: <span id="balanceVal" class="text-success">$0.00</span></span>
            </div>
        </div>

        <div class="row g-4">
            <!-- Panel Kontrolny -->
            <div class="col-md-4">
                <div class="card p-3">
                    <h5 class="card-title mb-3">⚙️ Ustawienia Bota</h5>
                    <div class="mb-3">
                        <label class="form-label">Flash Loan (USDT)</label>
                        <input type="number" id="loanInput" class="form-control bg-dark text-white border-secondary" value="100000">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Min. Zysk Netto ($)</label>
                        <input type="number" id="profitInput" class="form-control bg-dark text-white border-secondary" value="15">
                    </div>
                    <button id="toggleBtn" class="btn btn-success w-100 fw-bold">URUCHOM BOTA</button>
                </div>
            </div>

            <!-- Monitor Cen -->
            <div class="col-md-8">
                <div class="card p-3">
                    <h5 class="card-title mb-3">📊 Śledzone Pary (PancakeSwap / Biswap)</h5>
                    <div class="row text-center" id="priceCards">
                        <!-- Generowane dynamicznie -->
                    </div>
                </div>
            </div>

            <!-- Wykres i Logi -->
            <div class="col-md-12">
                <div class="card p-3 mb-4">
                    <h5 class="card-title">📈 Historia Zysków</h5>
                    <canvas id="profitChart" height="80"></canvas>
                </div>
                <div class="card p-3">
                    <h5 class="card-title">📜 Logi Transakcji On-Chain</h5>
                    <div id="logBox" class="log-box p-3 rounded"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;
        const chartCtx = document.getElementById('profitChart').getContext('2d');
        const profitChart = new Chart(chartCtx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Zysk ($)', data: [], borderColor: '#0d6efd', tension: 0.2 }] },
            options: { scales: { y: { grid: { color: '#333' } }, x: { grid: { color: '#333' } } } }
        });

        async function updateDashboard() {
            const res = await fetch('/api/data');
            const data = await res.json();

            document.getElementById('balanceVal').innerText = `$${data.balance.toFixed(2)}`;
            document.getElementById('statusBadge').className = `badge status-badge ${data.running ? 'bg-success' : 'bg-danger'}`;
            document.getElementById('statusBadge').innerText = data.running ? 'AKTYWNY' : 'ZATRZYMANY';
            
            // Aktualizacja kart cenowych
            const priceContainer = document.getElementById('priceCards');
            priceContainer.innerHTML = '';
            for (const [pair, info] of Object.entries(data.prices)) {
                priceContainer.innerHTML += `
                    <div class="col-6 col-md-3 mb-2">
                        <div class="p-2 border border-secondary rounded bg-dark">
                            <small class="text-muted">${pair}</small>
                            <h6>$${info.price}</h6>
                            <span class="badge ${info.spread > 0.35 ? 'bg-warning text-dark' : 'bg-secondary'}">Spread: ${info.spread}%</span>
                        </div>
                    </div>`;
            }

            // Logi
            const logBox = document.getElementById('logBox');
            logBox.innerHTML = data.logs.map(l => `<div>${l}</div>`).join('');

            // Wykres
            if (data.running && data.logs.length > 0) {
                const time = new Date().toLocaleTimeString();
                profitChart.data.labels.push(time);
                profitChart.data.datasets[0].data.push(data.balance);
                if (profitChart.data.labels.length > 15) {
                    profitChart.data.labels.shift();
                    profitChart.data.datasets[0].data.shift();
                }
                profitChart.update();
            }
        }

        document.getElementById('toggleBtn').addEventListener('click', async () => {
            isRunning = !isRunning;
            const loanSize = document.getElementById('loanInput').value;
            const minProfit = document.getElementById('profitInput').value;

            await fetch('/api/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ running: isRunning, loanSize, minProfit })
            });

            document.getElementById('toggleBtn').innerText = isRunning ? 'ZATRZYMAJ BOTA' : 'URUCHOM BOTA';
            document.getElementById('toggleBtn').className = `btn w-100 fw-bold ${isRunning ? 'btn-danger' : 'btn-success'}`;
        });

        setInterval(updateDashboard, 2000);
    </script>
</body>
</html>
