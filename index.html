<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic City Builder 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #0b0f19; color: #fff; overflow: hidden; }
        #webgl-container { width: 100vw; height: 100vh; display: block; }
        
        /* UI HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }
        .panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 24px;
            pointer-events: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .stats { display: flex; gap: 30px; font-weight: 600; font-size: 15px; }
        .stat-val { color: #38bdf8; margin-left: 6px; }

        #toolbar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }
        .btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
    </style>
    <!-- Import Three.js oraz OrbitControls z CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="hud">
    <div class="panel stats">
        <div>Budżet: <span id="money" class="stat-val">$100,000</span></div>
        <div>Mieszkańcy: <span id="pop" class="stat-val">0</span></div>
        <div>Zasilanie: <span id="power" class="stat-val">OK</span></div>
    </div>
</div>

<div id="toolbar">
    <button class="btn active" onclick="setTool('select')">🔍 Podgląd</button>
    <button class="btn" onclick="setTool('road')">🛣️ Asfaltowa Droga</button>
    <button class="btn" onclick="setTool('res')">🏢 Wieżowiec (PBR Glass)</button>
    <button class="btn" onclick="setTool('power')">⚡ Elektrownia</button>
    <button class="btn" onclick="setTool('tree')">🌲 Park / Zielona Strefa</button>
</div>

<div id="webgl-container"></div>

<script>
// --- INICJALIZACJA SCENY THREE.JS (WEBGL) ---
const container = document.getElementById('webgl-container');

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0f172a');
scene.fog = new THREE.FogExp2('#0f172a', 0.012); // Realistyczna mgła głębi

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(40, 35, 40);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Miękkie, realistyczne cienie
renderer.toneMapping = THREE.ACESFilmicToneMapping; // Filmowa korekcja kolorów
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2.1; // Brak możliwości przejścia pod ziemię
controls.target.set(0, 0, 0);

// --- REALISTYCZNE OŚWIETLENIE SCENY ---
const ambientLight = new THREE.AmbientLight('#94a3b8', 0.6);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight('#fff7ed', 1.8);
sunLight.position.set(50, 80, 30);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 200;
sunLight.shadow.camera.left = -50;
sunLight.shadow.camera.right = 50;
sunLight.shadow.camera.top = 50;
sunLight.shadow.camera.bottom = -50;
sunLight.shadow.bias = -0.0005;
scene.add(sunLight);

// --- MATERIAŁY PBR (Physically Based Rendering) ---
const materials = {
    ground: new THREE.MeshStandardMaterial({ color: '#1e293b', roughness: 0.9, metalness: 0.1 }),
    grid: new THREE.MeshBasicMaterial({ color: '#334155', wireframe: true, transparent: true, opacity: 0.15 }),
    road: new THREE.MeshStandardMaterial({ color: '#334155', roughness: 0.8, metalness: 0.2 }),
    glassBuilding: new THREE.MeshPhysicalMaterial({ 
        color: '#38bdf8', 
        metalness: 0.1, 
        roughness: 0.1, 
        transmission: 0.6, // Przezroczystość szkła
        thickness: 1.2,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1
    }),
    steel: new THREE.MeshStandardMaterial({ color: '#64748b', metalness: 0.8, roughness: 0.3 }),
    concrete: new THREE.MeshStandardMaterial({ color: '#94a3b8', roughness: 0.7, metalness: 0.1 }),
    foliage: new THREE.MeshStandardMaterial({ color: '#10b981', roughness: 0.9, metalness: 0.0 }),
    trunk: new THREE.MeshStandardMaterial({ color: '#78350f', roughness: 0.9 })
};

// --- PODŁOŻE I SIATKA ---
const GRID_SIZE = 30;
const TILE_SIZE = 2;

const groundGeo = new THREE.PlaneGeometry(GRID_SIZE * TILE_SIZE, GRID_SIZE * TILE_SIZE);
const ground = new THREE.Mesh(groundGeo, materials.ground);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const gridHelper = new THREE.GridHelper(GRID_SIZE * TILE_SIZE, GRID_SIZE, '#475569', '#334155');
gridHelper.position.y = 0.01;
scene.add(gridHelper);

// --- LOGIKA BUDOWANIA I RAYCASTING ---
const objectsMap = new Map();
let currentTool = 'select';

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// Kursor podglądu (Ghost Tile)
const pointerGeo = new THREE.BoxGeometry(TILE_SIZE, 0.1, TILE_SIZE);
const pointerMat = new THREE.MeshBasicMaterial({ color: '#38bdf8', transparent: true, opacity: 0.4 });
const pointerMesh = new THREE.Mesh(pointerGeo, pointerMat);
scene.add(pointerMesh);

function setTool(tool) {
    currentTool = tool;
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
}

window.addEventListener('pointermove', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObject(ground);

    if (intersects.length > 0) {
        const pt = intersects[0].point;
        const gx = Math.floor((pt.x + (GRID_SIZE * TILE_SIZE) / 2) / TILE_SIZE);
        const gz = Math.floor((pt.z + (GRID_SIZE * TILE_SIZE) / 2) / TILE_SIZE);

        const worldX = (gx * TILE_SIZE) - (GRID_SIZE * TILE_SIZE) / 2 + TILE_SIZE / 2;
        const worldZ = (gz * TILE_SIZE) - (GRID_SIZE * TILE_SIZE) / 2 + TILE_SIZE / 2;

        pointerMesh.position.set(worldX, 0.05, worldZ);
    }
});

window.addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON') return;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObject(ground);

    if (intersects.length > 0) {
        const pt = intersects[0].point;
        const gx = Math.floor((pt.x + (GRID_SIZE * TILE_SIZE) / 2) / TILE_SIZE);
        const gz = Math.floor((pt.z + (GRID_SIZE * TILE_SIZE) / 2) / TILE_SIZE);
        const key = `${gx},${gz}`;

        if (gx >= 0 && gx < GRID_SIZE && gz >= 0 && gz < GRID_SIZE && !objectsMap.has(key)) {
            const worldX = (gx * TILE_SIZE) - (GRID_SIZE * TILE_SIZE) / 2 + TILE_SIZE / 2;
            const worldZ = (gz * TILE_SIZE) - (GRID_SIZE * TILE_SIZE) / 2 + TILE_SIZE / 2;

            createBuilding(currentTool, worldX, worldZ, key);
        }
    }
});

// --- FABRYKA REALISTYCZNYCH MODELI 3D ---
function createBuilding(type, x, z, key) {
    const group = new THREE.Group();
    group.position.set(x, 0, z);

    if (type === 'road') {
        const roadGeo = new THREE.BoxGeometry(TILE_SIZE, 0.05, TILE_SIZE);
        const roadMesh = new THREE.Mesh(roadGeo, materials.road);
        roadMesh.receiveShadow = true;
        group.add(roadMesh);
    } 
    else if (type === 'res') {
        // Nowoczesny szklany wieżowiec z realistyczną strukturą
        const height = 6 + Math.random() * 8;
        
        // Trzon wieżowca
        const coreGeo = new THREE.BoxGeometry(1.4, height, 1.4);
        const glassMesh = new THREE.Mesh(coreGeo, materials.glassBuilding);
        glassMesh.position.y = height / 2;
        glassMesh.castShadow = true;
        glassMesh.receiveShadow = true;
        group.add(glassMesh);

        // Stalowe ramy / detale architektoniczne
        const frameGeo = new THREE.BoxGeometry(1.45, 0.2, 1.45);
        for(let h = 1; h < height; h += 1.5) {
            const frameMat = new THREE.Mesh(frameGeo, materials.steel);
            frameMat.position.y = h;
            frameMat.castShadow = true;
            group.add(frameMat);
        }
    } 
    else if (type === 'power') {
        // Elektrownia / Reaktor przemysłowy
        const baseGeo = new THREE.CylinderGeometry(0.8, 1.1, 3, 16);
        const reactor = new THREE.Mesh(baseGeo, materials.concrete);
        reactor.position.y = 1.5;
        reactor.castShadow = true;
        group.add(reactor);
    }
    else if (type === 'tree') {
        // Drzewo w parku
        const trunkGeo = new THREE.CylinderGeometry(0.1, 0.15, 0.8, 8);
        const trunk = new THREE.Mesh(trunkGeo, materials.trunk);
        trunk.position.y = 0.4;
        trunk.castShadow = true;
        group.add(trunk);

        const leavesGeo = new THREE.DodecahedronGeometry(0.7, 1);
        const leaves = new THREE.Mesh(leavesGeo, materials.foliage);
        leaves.position.y = 1.1;
        leaves.castShadow = true;
        group.add(leaves);
    }

    if (group.children.length > 0) {
        scene.add(group);
        objectsMap.set(key, group);
    }
}

// --- ANIMACJA I PETLA RENDEROWANIA ---
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
